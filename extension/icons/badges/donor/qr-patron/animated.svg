<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" role="img" aria-label="Donátor · QR Patron"><style>.motion{animation-duration:3s;animation-iteration-count:infinite;animation-delay:0s;animation-timing-function:linear}.qr-patron-shine{transform-origin:0px 0px;transform:translate(-18px,0px) rotate(0deg) scale(1,1);opacity:0;animation-name:qr-patron-shine}.qr-patron-qr-tl{transform-origin:3.5px 3.5px;transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1;animation-name:qr-patron-qr-tl}.qr-patron-qr-tr{transform-origin:16.5px 3.5px;transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1;animation-name:qr-patron-qr-tr}.qr-patron-qr-bl{transform-origin:3.5px 16.5px;transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1;animation-name:qr-patron-qr-bl}.qr-patron-qr-pixels{transform-origin:10px 10px;transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1;animation-name:qr-patron-qr-pixels}.qr-patron-heart-beat{transform-origin:11px 11.5px;transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1;animation-name:qr-patron-heart-beat}.qr-patron-qr-burst{transform-origin:10px 10px;transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1;animation-name:qr-patron-qr-burst}@keyframes qr-patron-shine{0%{transform:translate(-18px,0px) rotate(0deg) scale(1,1);opacity:0}7%{transform:translate(-18px,0px) rotate(0deg) scale(1,1);opacity:0}16%{transform:translate(-7px,0px) rotate(0deg) scale(1,1);opacity:0.82}45%{transform:translate(26px,0px) rotate(0deg) scale(1,1);opacity:0.82}54%{transform:translate(33px,0px) rotate(0deg) scale(1,1);opacity:0}100%{transform:translate(33px,0px) rotate(0deg) scale(1,1);opacity:0}}@keyframes qr-patron-qr-tl{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}7%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}20%{transform:translate(-3px,-2.4px) rotate(-100deg) scale(1,1);opacity:1}32%{transform:translate(-1.7999999999999998px,-1.44px) rotate(-50deg) sca