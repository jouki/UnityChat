<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" role="img" aria-label="Donátor · Money bag"><style>.motion{animation-duration:3s;animation-iteration-count:infinite;animation-delay:0s;animation-timing-function:linear}.money-bag-shine{transform-origin:0px 0px;transform:translate(-18px,0px) rotate(0deg) scale(1,1);opacity:0;animation-name:money-bag-shine}.money-bag-gold-left{transform-origin:3px 6px;transform:translate(0px,0px) rotate(0deg) scale(0.30000000000000004,0.30000000000000004);opacity:0;animation-name:money-bag-gold-left}.money-bag-gold-right{transform-origin:16.5px 5px;transform:translate(0px,0px) rotate(0deg) scale(0.30000000000000004,0.30000000000000004);opacity:0;animation-name:money-bag-gold-right}.money-bag-bag-jump{transform-origin:10px 10px;transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1;animation-name:money-bag-bag-jump}@keyframes money-bag-shine{0%{transform:translate(-18px,0px) rotate(0deg) scale(1,1);opacity:0}7%{transform:translate(-18px,0px) rotate(0deg) scale(1,1);opacity:0}16%{transform:translate(-7px,0px) rotate(0deg) scale(1,1);opacity:0.82}45%{transform:translate(26px,0px) rotate(0deg) scale(1,1);opacity:0.82}54%{transform:translate(33px,0px) rotate(0deg) scale(1,1);opacity:0}100%{transform:translate(33px,0px) rotate(0deg) scale(1,1);opacity:0}}@keyframes money-bag-gold-left{0%{transform:translate(0px,0px) rotate(0deg) scale(0.30000000000000004,0.30000000000000004);opacity:0}12%{transform:translate(0px,0px) rotate(0deg) scale(0.30000000000000004,0.30000000000000004);opacity:0}22%{transform:translate(-0.6px,-1px) rotate(0deg) scale(1,1);opacity:1}34%{transform:translate(-1.1px,0.5px) rotate(0deg) scale(0.7,0.7);opacity:1}43%{transform:translate(-0.6px,2px) rotate(0deg) scale(0.30000000000000004,0.30000000000000004);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(0.30000000000000004,0.30000000000000004);opacity:0}}@keyframes money-bag-gold-right{0%{transform:translate(0px,0px) rotate(0deg) scale(0.30000000000000004,0.30000000000000004);opacity:0}12%{transform:translate(0px,0px) rotate(0deg) scale(0.30000000000000004,0.30000000000000004);opacity:0}22%{transform:translate(0.6px,-1px) rotate(0deg) scale(1,1);opacity:1}34%{transform:translate(1.1px,0.5px) rotate(0deg) scale(0.7,0.7);opacity:1}43%{transform:translate(0.6px,2px) rotate(0deg) scale(0.30000000000000004,0.30000000000000004);opacity:0}100%{transform:translate(0px,0px) rotate(0deg) scale(0.30000000000000004,0.30000000000000004);opacity:0}}@keyframes money-bag-bag-jump{0%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}7.5%{transform:translate(0px,0.8px) rotate(0deg) scale(1.0368,0.8063999999999999);opacity:1}17%{transform:translate(0px,-2.35px) rotate(-17deg) scale(0.657,0.7665);opacity:1}26%{transform:translate(0px,-2.5px) rotate(12deg) scale(0.7,0.7);opacity:1}38%{transform:translate(0px,-0.6px) rotate(-8deg) scale(0.83,0.83);opacity:1}46%{transform:translate(0px,1.7px) rotate(0deg) scale(1.0528,0.6861999999999999);opacity:1}54%{transform:translate(0px,-0.65px) rotate(5deg) scale(0.7989999999999999,0.901);opacity:1}65%{transform:translate(0px,0px) rotate(0deg) scale(0.98,0.98);opacity:1}73%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}100%{transform:translate(0px,0px) rotate(0deg) scale(1,1);opacity:1}}@media(prefers-reduced-motion:reduce){.motion{animation:none!important}}</style><defs><linearGradient id="money-bag-gold" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#ffc800"/><stop offset="1" stop-color="#ff8c00"/></linearGradient><clipPath id="money-bag-silhouette"><path d="M6 1 8 5h4l2-4-3 1-1-1-1 1ZM7 6h6l4.5 5.5c2.8 4 .9 7.5-3.5 7.5H6c-4.4 0-6.3-3.5-3.5-7.5Z"/></clipPath><linearGradient id="money-bag-sheen"><stop stop-color="#fffbea" stop-opacity="0"/><stop offset=".47" stop-color="#fffbea" stop-opacity=".25"/><stop offset=".52" stop-color="#fffbea" stop-opacity="1"/><stop offset="1" stop-color="#fffbea" stop-opacity="0"/></linearGradient></d