<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnityChat</title>
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="composer.css">
  <link rel="stylesheet" href="soundboard.css">
  <link rel="stylesheet" href="sfx-request.css">
  <link rel="stylesheet" href="qr-dono.css">
  <link rel="stylesheet" href="moderation.css">
  <link rel="stylesheet" href="gif.css">
</head>
<body>
  <!-- Header -->
  <div id="header">
    <div id="header-title">&#9889; UnityChat</div>
    <div id="header-actions">
      <!-- Souhrnný stav připojení platforem; klik sbalí / rozbalí řádek s filtry (#bar). -->
      <button id="btn-bar" type="button" title="Připojení platforem — sbalit řádek" aria-label="Stav připojení platforem" aria-expanded="true"><span class="dot"></span></button>
      <button id="btn-reconnect" title="Znovu připojit ke všem chatům" aria-label="Znovu připojit">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
      </button>
      <!-- Ikona „otevřít v novém okně" (Denis Klyuchnikov, Noun Project) — fill=currentColor, barvu dává CSS -->
      <button id="btn-popout" title="Otevřít v samostatném okně" aria-label="Otevřít v samostatném okně">
        <svg viewBox="8 8 80 80" width="16" height="16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M73.7883228,16 L44.56401,45.2243128 C42.8484762,46.9398466 42.8459918,49.728257 44.5642987,51.4465639 C46.2791092,53.1613744 49.0684023,53.1650001 50.7865498,51.4468526 L80,22.2334024 L80,32.0031611 C80,34.2058797 81.790861,36 84,36 C86.2046438,36 88,34.2105543 88,32.0031611 L88,11.9968389 C88,10.8960049 87.5527117,9.89722307 86.8294627,9.17343595 C86.1051125,8.44841019 85.1063303,8 84.0031611,8 L63.9968389,8 C61.7941203,8 60,9.790861 60,12 C60,14.2046438 61.7894457,16 63.9968389,16 L73.7883228,16 L73.7883228,16 Z M88,56 L88,36.9851507 L88,78.0296986 C88,83.536144 84.0327876,88 79.1329365,88 L16.8670635,88 C11.9699196,88 8,83.5274312 8,78.0296986 L8,17.9703014 C8,12.463856 11.9672124,8 16.8670635,8 L59.5664682,8 L40,8 C42.209139,8 44,9.790861 44,12 C44,14.209139 42.209139,16 40,16 L18.2777939,16 C17.0052872,16 16,17.1947367 16,18.668519 L16,77.331481 C16,78.7786636 17.0198031,80 18.2777939,80 L77.7222061,80 C78.9947128,80 80,78.8052633 80,77.331481 L80,56 C80,53.790861 81.790861,52 84,52 C86.209139,52 88,53.790861 88,56 L88,56 Z"/></svg>
      </button>
      <button id="btn-dump" title="Stáhnout debug log">&#128190;</button>
      <button id="btn-settings" title="Nastavení">&#9881;</button>
    </div>
  </div>

  <!-- Settings Panel -->
  <div id="settings" class="hidden">
    <details class="settings-section" id="channels-section">
      <summary>
        <span>Kanály</span>
      </summary>
      <div class="setting-row">
        <label for="input-channel">Twitch</label>
        <input type="text" id="input-channel" value="robdiesalot" spellcheck="false" autocomplete="off" readonly title="Nastaveno automaticky z aktivního tabu">
      </div>
      <div class="setting-row">
        <label for="input-kick-channel">Kick</label>
        <input type="text" id="input-kick-channel" value="robdiesalot" spellcheck="false" autocomplete="off" readonly title="Nastaveno automaticky z aktivního tabu">
      </div>
      <div class="setting-row">
        <label for="input-yt-channel">YouTube</label>
        <input type="text" id="input-yt-channel" value="robdiesalot" placeholder="Název kanálu nebo @handle" spellcheck="false" autocomplete="off" readonly title="Nastaveno automaticky z aktivního tabu">
      </div>
    </details>
    <!-- Email účtu (core/email-verify.js createEmailSettings). -->
    <div id="email-settings" class="setting-row"></div>
    <div class="setting-row">
      <label for="input-username">USERNAME (TWITCH)</label>
      <input type="text" id="input-username" placeholder="Detekováno automaticky" spellcheck="false" autocomplete="off" readonly>
    </div>
    <div class="setting-row">
      <label for="input-nickname">UnityChat přezdívka</label>
      <input type="text" id="input-nickname" placeholder="Vlastní přezdívka" maxlength="30" spellcheck="false" autocomplete="off">
      <label for="input-color-hex" class="color-label">Barva jména</label>
      <div class="color-row">
        <input type="color" id="input-color-picker" value="#ff8c00">
        <input type="text" id="input-color-hex" placeholder="#ff8c00" maxlength="7" spellcheck="false" autocomplete="off">
      </div>
      <div class="save-row">
        <button id="btn-nickname" class="btn-nick">Uložit</button>
      </div>
      <span id="nickname-status" class="nick-status"></span>
    </div>
    <div class="setting-row">
      <label for="input-layout">Velikost layoutu</label>
      <select id="input-layout">
        <option value="small">Malá</option>
        <option value="medium">Střední</option>
        <option value="large">Velká</option>
      </select>
    </div>
    <div class="setting-row" id="row-deleted-style" hidden>
      <label for="input-deleted-style">Smazané zprávy</label>
      <select id="input-deleted-style" title="Jen pro moderátory: jak vidíš smazané a skryté zprávy (vždy zašedlé). „Zpráva smazána“ místo textu, zašedlý text se štítkem, nebo přeškrtnutý text se štítkem. Diváci vidí vždy zašedlé „Zpráva smazána“.">
        <option value="label">Zpráva smazána</option>
        <option value="dim">Zašedlé</option>
        <option value="strike">Přeškrtnuté</option>
      </select>
    </div>
    <div class="setting-row">
      <label class="platform-check" for="chk-timestamps">
        <input type="checkbox" id="chk-timestamps" checked>
        Zobrazit časové značky
      </label>
    </div>
    <div class="setting-row">
      <label class="platform-check" for="chk-reply-oneline">
        <input type="checkbox" id="chk-reply-oneline">
        Odpovědi zobrazit na jeden řádek
      </label>
    </div>
    <div class="setting-row">
      <label class="platform-check" for="chk-mention-notify">
        <input type="checkbox" id="chk-mention-notify">
        Upozornit na zmínky (oznámení prohlížeče)
      </label>
      <div id="mention-notify-note" class="setting-note hidden" role="status"></div>
    </div>
    <div class="setting-row">
      <label class="platform-check" for="chk-sound">
        <input type="checkbox" id="chk-sound" checked>
        Přehrávat zvuky
      </label>
    </div>
    <div class="setting-row">
      <label class="platform-check" for="chk-reaction-scrollback">
        <input type="checkbox" id="chk-reaction-scrollback" checked>
        Po animaci se vrátit na konec chatu
      </label>
    </div>
    <div class="setting-row">
      <label class="platform-check" for="chk-ac-colon">
        <input type="checkbox" id="chk-ac-colon">
        Našeptávat emoty po dvojtečce (:)
      </label>
    </div>
    <div class="setting-row dev-mode-row">
      <label class="platform-check">
        <input type="checkbox" id="chk-devmode">
        Dev mode
      </label>
      <div class="author-stack">
        <a href="https://jouki.cz" target="_blank" rel="noopener" class="author-link" title="Autor: Jouki — jouki.cz">
          <span class="author-by">by</span> <span class="author-name">Jouki</span>
        </a>
        <a href="https://ko-fi.com/jouki" target="_blank" rel="noopener" class="kofi-link" title="Support on Ko-fi">☕ Kup mi Ko-fičko</a>
      </div>
    </div>
    <div id="dev-tools" class="setting-row dev-tools hidden">
      <!-- Záloha: stará cesta odesílání přes otevřenou kartu se streamem (bez přihlášení). -->
      <label class="platform-check" for="chk-legacy-send" title="Pojistka pro případ výpadku odesílání přes účet">
        <input type="checkbox" id="chk-legacy-send">
        Posílat přes otevřenou kartu (stará cesta)
      </label>
      <button id="btn-dump-cache">Stáhnout message cache</button>
      <button id="btn-dump-nicknames">Stáhnout nickname cache</button>
      <button id="btn-clear-cache">Smazat message cache</button>
    </div>
  </div>

  <!-- Nabídka přepnutí na jiného podporovaného streamera (jen ručně) -->
  <div id="switch-offer" class="hidden">
    <button id="btn-switch-streamer" type="button">Přepnout chat</button>
  </div>

  <!-- Status + Filter Bar -->
  <div id="bar">
    <!-- Filtr + stav připojení v jednom: tečka = stav platformy
         (červená nepřipojeno, žlutá připojuje se, zelená připojeno),
         šedá = platforma vyfiltrovaná (tlačítko vypnuté). -->
    <div id="filters">
      <button class="fbtn active" data-platform="twitch" id="st-twitch" title="Twitch"><span class="dot"></span>TW</button>
      <button class="fbtn active" data-platform="youtube" id="st-youtube" title="YouTube"><span class="dot"></span>YT</button>
      <button class="fbtn active" data-platform="kick" id="st-kick" title="Kick"><span class="dot"></span>KI</button>
    </div>
  </div>

  <!-- Pinned message banner -->
  <div id="pinned-banner" class="hidden"></div>

  <!-- Community highlights (hype train, gift-sub leaderboard) — mirrored
       from the live Twitch tab DOM by content/twitch.js. -->
  <div id="highlights-banner" class="hidden"></div>

  <!-- Chat -->
  <div id="chat-wrapper">
    <div id="chat"></div>
    <button id="btn-scroll" class="hidden">&darr; Nové zprávy</button>

    <!-- Loading overlay shown while cache hydrates + providers connect.
         JS clears it on first rendered message (or a hard timeout). -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="lo-logo-stack">
        <span class="lo-logo-glow" aria-hidden="true"></span>
        <img src="icons/icon128.png" class="lo-logo" alt="">
      </div>
      <div class="lo-text">Načítání chatu</div>
      <div class="lo-platforms" aria-hidden="true">
        <span class="lo-pill" data-platform="twitch">TW</span>
        <span class="lo-pill" data-platform="youtube">YT</span>
        <span class="lo-pill" data-platform="kick">KI</span>
      </div>
      <div class="lo-bar" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <!-- Twitch credit summary mirrored from open Twitch tab — bits +
       channel-point balance. Hidden until first snapshot arrives. -->
  <!-- Kotva panelu QR dona (nad řádkem i nad polem, ať se tlačítko může přesouvat). -->
  <div id="qd-anchor" class="uc-qd-anchor"></div>
  <div id="tw-credits" class="hidden">
    <span class="tc-pill tc-bits hidden">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path fill-rule="evenodd" d="m12 22-9-8 9-13 9 13-9 8Zm-4.844-6.982-1.503-1.336L12 4.514l6.347 9.168-1.503 1.336L12 13l-4.844 2.018Z" clip-rule="evenodd"/></svg>
      <span class="tc-bits-val">0</span>
    </span>
    <span class="tc-pill tc-points hidden">
      <span class="tc-points-icon" aria-hidden="true"></span>
      <span class="tc-points-val">0</span>
    </span>
    <span class="tc-pill tc-claim hidden" title="Vyzvédněte si bonus kliknutím!">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M20 8h-3V6a3 3 0 0 0-6 0v2H8a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM13 6a1 1 0 0 1 2 0v2h-2V6zm5 14H10v-2h8v2zm0-4H10v-2h8v2z"/></svg>
      <span class="tc-claim-label">Vyzvednout bonus</span>
    </span>
    <!-- QR dono (core/qr-dono.js) — jen u kanálu s dary (body.uc-dono); bez credits pill je v řádku samo. -->
    <button id="btn-qrdono" type="button" class="uc-tool-btn" title="QR dono" aria-label="QR dono"></button>
  </div>

  <!-- Input pro odesílání zpráv -->
  <div id="input-area">
    <!-- Výběr platformy: badge + šipka → menu „Psát jako" (přihlášení / přepnutí / odpojení),
         stejné jako na webu (core/login-modal.js renderPlatformMenu). -->
    <div id="platform-menu" class="hidden" role="menu"></div>
    <button id="platform-btn" type="button" title="Vyber platformu / přihlas se" aria-haspopup="menu" aria-expanded="false">
      <span id="active-badge" class="badge">--</span><span class="pm-arrow" aria-hidden="true">&#9662;</span>
    </button>
    <div class="msg-input-wrap">
      <textarea id="msg-input" rows="1" placeholder="Otevři stream pro odesílání..." autocomplete="off" spellcheck="false" disabled></textarea>
      <button id="btn-sfx" type="button" class="emote-btn hidden" aria-label="Soundboard"></button>
      <button id="btn-emotes" type="button" class="emote-btn" title="Emoty"></button>
    </div>
    <!-- Bez přihlášení místo pole: výzva (otevře přihlašovací okno). -->
    <button id="login-cta" type="button" class="hidden">Pro psaní se musíš přihlásit — klikni sem</button>
    <button id="btn-send" disabled>&#10148;</button>
  </div>

  <script type="module" src="core-bridge.js"></script>
  <script defer src="sidepanel.js"></script>
</body>
</html>
